<dialog id="pdf-modal" class="modal">
    <div class="modal-box rounded-2xl">
        <h3 class="font-semibold text-lg">Generate Legal Notice PDF</h3>
        <p class="text-sm text-slate-500 mt-2">This will create a formal PDF from your current notice draft.</p>
        <div class="modal-action">
            <form method="dialog"><button class="btn btn-ghost rounded-xl">Cancel</button></form>
            <button class="btn btn-primary rounded-xl" id="confirm-pdf">Generate</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
