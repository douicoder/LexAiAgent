<dialog id="delete-modal" class="modal">
    <div class="modal-box rounded-2xl">
        <h3 class="font-semibold text-lg text-danger">Delete Case</h3>
        <p class="text-sm text-slate-500 mt-2">This action cannot be undone. All messages and drafts will be permanently deleted.</p>
        <div class="modal-action">
            <form method="dialog"><button class="btn btn-ghost rounded-xl">Cancel</button></form>
            <button class="btn btn-error rounded-xl" id="confirm-delete">Delete</button>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
