<!DOCTYPE html>
<html lang="en" data-theme="lexagent">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LexAgent{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: '#0F172A',
                        accent: '#2563EB',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                    },
                    borderRadius: { xl: '16px' },
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            htmx.config.responseHandling = [
                { code: '204', swap: false },
                { code: '[23]..', swap: true },
                { code: '[45]..', swap: true, error: true },
                { code: '...', swap: false }
            ];
        });
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-primary font-sans antialiased">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="fixed top-4 right-4 z-50 space-y-2" id="flash-messages">
            {% for category, message in messages %}
            <div class="alert alert-{{ 'error' if category == 'error' else 'info' }} shadow-lg max-w-sm animate-fade-in">
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
