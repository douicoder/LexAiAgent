<div class="response-card p-4 rounded-xl bg-blue-50 border border-blue-100 mt-2">
    <p class="text-sm text-slate-700 mb-3">{{ response.reply }}</p>

    <form hx-post="/api/cases/{{ case_id }}/execute-step/{{ step_number }}"
          hx-target="#step-{{ step_number }}-response"
          hx-swap="innerHTML"
          class="space-y-2">
        {% for q in response.clarifying_questions %}
        <div class="flex items-center gap-2">
            <label class="text-sm text-slate-600 min-w-[120px]">{{ q.question }}</label>
            <input type="text"
                   name="field_{{ q.key }}"
                   class="input input-sm input-bordered w-full rounded-xl text-sm"
                   placeholder="Enter {{ q.question|lower }}"
                   required>
        </div>
        {% endfor %}
        <input type="hidden" name="collected_info" value="{}">

        <button type="submit"
                class="btn btn-sm btn-primary rounded-full mt-2 gap-1.5"
                hx-disabled-elt="this">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span class="button-text">Submit</span>
            <span class="loading loading-spinner loading-xs htmx-indicator"></span>
        </button>
    </form>
</div>
