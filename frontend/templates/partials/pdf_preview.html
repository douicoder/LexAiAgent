<div x-data="{ open: true }" x-show="open" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" @click.self="open = false">
    <div class="bg-white rounded-2xl shadow-2xl w-[90vw] h-[90vh] flex flex-col overflow-hidden">
        <div class="flex items-center justify-between p-4 border-b border-slate-200">
            <h3 class="font-semibold text-primary">PDF Preview</h3>
            <div class="flex items-center gap-2">
                <a href="data:application/pdf;base64,{{ pdf_base64 }}" download="document.pdf"
                   class="btn btn-sm btn-primary rounded-full gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    Download
                </a>
                <button class="btn btn-sm btn-ghost rounded-full" @click="open = false">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="flex-1 overflow-auto p-4 bg-slate-100">
            <embed src="data:application/pdf;base64,{{ pdf_base64 }}" type="application/pdf" class="w-full h-full rounded-xl shadow-sm"/>
        </div>
    </div>
</div>
