<div x-data="voiceRecorder()" class="relative">
    <button type="button" @click="toggleRecording()"
            :class="recording ? 'bg-danger text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
            class="btn btn-circle btn-sm rounded-full transition-colors"
            title="Voice input">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
    </button>
    <input type="file" accept="audio/*" class="hidden" x-ref="fileInput" @change="uploadAudio($event)">
    <div x-show="recording" x-cloak class="absolute -top-10 left-1/2 -translate-x-1/2 text-xs text-danger whitespace-nowrap">
        Recording...
    </div>
</div>
