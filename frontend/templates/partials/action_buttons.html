{% if buttons %}
<div class="flex flex-wrap gap-2 mt-4">
    {% for btn in buttons %}
    <button type="button"
            class="action-chip btn btn-sm btn-outline rounded-full border-slate-300 hover:border-accent hover:bg-blue-50 hover:text-accent"
            data-message="{{ btn.message }}"
            onclick="sendActionMessage(this)">
        {{ btn.label }}
    </button>
    {% endfor %}
</div>
{% endif %}
