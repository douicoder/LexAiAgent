{% if role == 'user' %}
<div class="message-block user-block py-6 border-b border-slate-100">
    <div class="max-w-[900px] mx-auto px-6">
        <p class="text-sm font-semibold text-primary mb-2">{{ name or 'You' }}</p>
        <div class="text-slate-700 leading-relaxed whitespace-pre-wrap">{{ content }}</div>
    </div>
</div>
{% else %}
<div class="message-block assistant-block py-6 border-b border-slate-100 bg-white">
    <div class="max-w-[900px] mx-auto px-6">
        <p class="text-sm font-semibold text-accent mb-2">LexAgent</p>
        <div class="text-slate-700 leading-relaxed whitespace-pre-wrap">{{ content }}</div>
        {% if extra %}{{ extra|safe }}{% endif %}
    </div>
</div>
{% endif %}
