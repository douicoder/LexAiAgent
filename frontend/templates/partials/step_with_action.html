<div class="step-item flex items-start gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:border-accent/30 transition-colors">
    <span class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium mt-0.5
          {% if step.status == 'completed' %}bg-success text-white{% else %}bg-accent text-white{% endif %}">
        {% if step.status == 'completed' %}
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        {% else %}
        {{ step.number }}
        {% endif %}
    </span>
    <div class="flex-1 min-w-0">
        <p class="text-sm text-slate-700 leading-relaxed">{{ step.text }}</p>
        {% if step.action_type == 'generate_document' and step.status != 'completed' %}
        <form hx-post="/api/cases/{{ case_id }}/execute-step/{{ step.number }}"
              hx-target="#documents-panel"
              hx-swap="innerHTML"
              class="inline-block mt-2">
            <button type="submit"
                    class="btn btn-xs btn-outline btn-accent rounded-full gap-1.5"
                    hx-disabled-elt="this">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span class="button-text">Generate {{ (step.action_config or {}).get('title', 'Document') }}</span>
                <span class="loading loading-spinner loading-xs htmx-indicator"></span>
            </button>
        </form>
        {% endif %}
    </div>
</div>
